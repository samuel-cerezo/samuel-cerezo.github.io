<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"><title>Selezionare e aprire con il mouse</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d83"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="2" y="2" width="756" height="336" rx="16" fill="#edf3f7" stroke="#edf3f7" stroke-width="2"/><rect x="85" y="56" width="106" height="172" rx="50" fill="#fff" stroke="#bfd0dd" stroke-width="2"/><path d="M138 57 L138 124" stroke="#285d83" stroke-width="3" fill="none"/><rect x="127" y="82" width="21" height="41" rx="8" fill="#b6cbd8" stroke="#bfd0dd" stroke-width="2"/><path d="M180 100 L268 100" stroke="#285d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="290" y="108" font-size="29" fill="#223b50" font-weight="700">1 clic: seleziona</text><path d="M180 188 L268 188" stroke="#285d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="290" y="196" font-size="29" fill="#223b50" font-weight="700">2 clic: apre</text><text x="72" y="290" font-size="23" fill="#223b50" font-weight="400">Sul web basta normalmente un clic sui collegamenti.</text></g></svg>