<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"><title>Verificare una richiesta prima di agire</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d83"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="2" y="2" width="756" height="336" rx="16" fill="#edf3f7" stroke="#edf3f7" stroke-width="2"/><rect x="38" y="46" width="323" height="169" rx="12" fill="#fff5e9" stroke="#bfd0dd" stroke-width="2"/><text x="59" y="88" font-size="25" fill="#223b50" font-weight="700">Richiesta urgente</text><text x="59" y="130" font-size="21" fill="#223b50" font-weight="400">Conferma la password</text><text x="59" y="170" font-size="21" fill="#223b50" font-weight="400">entro dieci minuti...</text><path d="M376 126 L429 126" stroke="#285d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="450" y="46" width="271" height="169" rx="12" fill="#e4efe4" stroke="#bfd0dd" stroke-width="2"/><text x="471" y="89" font-size="28" fill="#267355" font-weight="700">Verifica</text><text x="471" y="131" font-size="22" fill="#223b50" font-weight="400">con un recapito</text><text x="471" y="168" font-size="22" fill="#223b50" font-weight="400">già conosciuto.</text><text x="69" y="287" font-size="25" fill="#223b50" font-weight="700">1. Fermati</text><text x="293" y="287" font-size="25" fill="#223b50" font-weight="700">2. Controlla</text><text x="543" y="287" font-size="25" fill="#223b50" font-weight="700">3. Verifica</text></g></svg>