<main>
<section class="hero profile-hero"><div class="hero-body container is-max-desktop"><p class="profile-eyebrow">Área docente · acceso privado</p><h1 class="title profile-title" id="guide-title">Guía de cursos</h1><div class="profile-description"><p id="guide-lead">Ingresá el código de 6 cifras de Google Authenticator.</p></div></div></section>
<section class="section section-soft"><div class="container is-max-desktop content">
<form id="guide-login" autocomplete="off">
  <label class="label" for="guide-code">Código de Google Authenticator</label>
  <input class="input" id="guide-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
  <button class="button is-link mt-3" type="submit">Entrar</button>
  <p id="guide-msg" role="status" aria-live="polite"></p>
</form>
<div id="guide-content" hidden></div>
<p class="is-size-7 mt-5"><a href="{{ '/courses/' | relative_url }}">Volver a Courses</a></p>
</div></section></main>
<footer class="footer site-footer"><div class="container is-max-desktop"><p class="footer-note">© {{ site.time | date: '%Y' }} Samuel Cerezo · <a href="/">Back to portfolio</a></p></div></footer>
<script>
(function(){
  var API='https://pdf2course.samuel-cerezo.workers.dev', KEY='pdf2course:guide-session';
  var form=document.getElementById('guide-login'), msg=document.getElementById('guide-msg'), box=document.getElementById('guide-content');
  function say(t,err){msg.textContent=t;msg.className=err?'error':''}
  function wireCopy(){
    box.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){
      var el=document.getElementById(b.dataset.copy),txt=el.textContent,ok=b.parentNode.querySelector('.copy-ok');
      function fallback(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');done()}catch(e){}}
      function done(){ok.hidden=false;setTimeout(function(){ok.hidden=true},2000)}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback)}else{fallback()}
    })});
  }
  async function load(token){
    var res=await fetch(API+'/api/guide',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(res.status===401){sessionStorage.removeItem(KEY);return false}
    if(!res.ok)throw new Error('http '+res.status);
    var d=await res.json();
    document.getElementById('guide-title').textContent=d.title;
    document.getElementById('guide-lead').textContent='Sesión de docente activa.';
    box.innerHTML=d.html; wireCopy(); form.hidden=true; box.hidden=false; return true;
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault(); say('Controlando…');
    try{
      var res=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('guide-code').value.trim()})});
      var d=await res.json().catch(function(){return{}});
      if(!res.ok){say(res.status===429?'Demasiados intentos. Esperá un rato.':'Código incorrecto o vencido. Probá con el siguiente.',true);return}
      sessionStorage.setItem(KEY,d.token); await load(d.token);
    }catch(err){say('No puedo conectar con el servidor. Probá de nuevo.',true)}
  });
  var t=sessionStorage.getItem(KEY); if(t)load(t).catch(function(){});
})();
</script>
